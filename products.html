<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Products - Fortune Reef Zona</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Explore our extensive catalog of globally recognized FMCG products ready for international export. Find premium sauces, coffee, plant milks, and home care items." />
    <meta name="keywords" content="FMCG catalog, export products, wholesale products Indonesia, ABC sauces, Wings Group distributors, wholesale coffee, B2B goods" />
    <meta name="author" content="Fortune Reef Zona" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.fortunereefzona.com/products.html" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta property="og:title" content="Our Export Catalog - Fortune Reef Zona" />
    <meta property="og:description" content="Discover out top-tier FMCG export products including instant delivery options and highly competitive pricing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.fortunereefzona.com/products.html" />
    <meta property="og:image" content="https://www.fortunereefzona.com/image/brand/unilever.png" />
    
    <!-- Security / Prevent framing & XSS (Basic) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </head>

  <body>
    <div id="main-navbar"></div>

    <header class="hero-products-small">
      <div class="hero-content">
        <nav class="breadcrumb">Home › Products</nav>
        <h1>Products</h1>
      </div>
    </header>

    <main class="products-container">
      <div class="container flex-layout">
        <!-- Filter Drawer -->
        <div class="drawer-backdrop" id="drawer-backdrop"></div>
        <aside class="sidebar-drawer" id="sidebar-drawer">
          <div class="drawer-header">
            <h3>Filters</h3>
            <button id="close-drawer" class="btn-close-drawer">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="sidebar-content">
            <div class="filter-group">
              <h3>Search</h3>
              <div class="search-box">
                <input type="text" id="product-search" placeholder="Search..." />
              </div>
            </div>

            <div class="filter-group">
              <h3>Category</h3>
              <ul class="filter-list">
                <!-- Categories will be dynamically injected by JavaScript based on products.json data -->
              </ul>
            </div>
            
            <div class="drawer-footer">
              <button id="apply-filters" class="btn-apply">Apply Filters</button>
            </div>
          </div>
        </aside>

        <section class="product-listing">
          <!-- Filter Toggle Button -->
          <div class="header-actions">
            <button id="filter-toggle" class="btn-filter">
              <i class="fas fa-sliders-h"></i> Filters & Sort
            </button>
            <div class="listing-header">
              <span id="product-counter">Loading products...</span>
              <div class="view-options">
                <i class="fas fa-th active"></i>
                <i class="fas fa-list"></i>
              </div>
            </div>
          </div>

          <!-- Best Seller Section -->
          <div class="best-seller-section">
            <div class="section-title-wrapper">
              <span class="badge">Export Excellence</span>
              <h2>Best Selling Products</h2>
              <p>Our top-performing products internationally</p>
            </div>
            <div class="best-seller-grid" id="best-seller-display">
              <!-- Content will be injected by JavaScript -->
            </div>
          </div>

          <div class="list-container" id="product-display"></div>

          <div
            id="load-more-container"
            style="text-align: center; margin-top: 30px"
          >
            <button
              id="load-more-btn"
              class="btn-details"
              style="cursor: pointer; padding: 12px 25px; display: none"
            >
              Load More Products
            </button>
          </div>
        </section>
      </div>
    </main>

    <footer id="main-footer" class="main-footer"></footer>

    <script src="script.js"></script>
  </body>
</html>
